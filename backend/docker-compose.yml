# Local development: PostgreSQL 18 (Neon's major, locale C like ops/neon/create-db.sql) + Valkey 8 (Redis-compatible,
# ADR-005). Profile "storage" adds S3Mock as a stand-in for the Neon Object Storage public bucket (ADR-017):
# anonymous GETs like the public bucket, S3 API for the ETL. scripts/etl-local-e2e.sh uses it.
# Usage: docker compose -f backend/docker-compose.yml up -d   (add --profile storage for the bucket)
# Host ports 15432/16379 (not 5432/6379) so they never collide with other local PostgreSQL/Redis instances.
services:
  postgres:
    image: postgres:18
    container_name: starindex-postgres
    environment:
      POSTGRES_DB: starindex
      POSTGRES_USER: starindex
      POSTGRES_PASSWORD: starindex-local
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"   # applies to a new volume only
      TZ: Asia/Seoul
    ports: ["127.0.0.1:15432:5432"]
    # postgres:18 keeps PGDATA under /var/lib/postgresql/18/docker; mount the parent (changed from 17 and earlier).
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starindex -d starindex"]
      interval: 5s
      retries: 20

  valkey:
    image: valkey/valkey:8
    container_name: starindex-valkey
    command: ["valkey-server", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru", "--save", ""]
    ports: ["127.0.0.1:16379:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      retries: 20

  storage:
    image: adobe/s3mock:5.2.3
    container_name: starindex-storage
    profiles: ["storage"]
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: starindex-packs
    ports: ["127.0.0.1:19090:9090"]

volumes:
  postgres-data:
