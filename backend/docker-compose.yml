# Local development: PostgreSQL 18 (same major as the planned RDS instance, ADR-013) + Valkey 8 (Redis-compatible, ADR-005).
# Usage: docker compose -f backend/docker-compose.yml up -d
services:
  postgres:
    image: postgres:18
    container_name: starindex-postgres
    environment:
      POSTGRES_DB: starindex
      POSTGRES_USER: starindex
      POSTGRES_PASSWORD: starindex-local
      TZ: Asia/Seoul
    ports: ["127.0.0.1:5432:5432"]
    # postgres:18 keeps PGDATA under /var/lib/postgresql/18/docker; mount the parent (changed from 17 and earlier).
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starindex -d starindex"]
      interval: 5s
      retries: 20

  valkey:
    image: valkey/valkey:8
    container_name: starindex-valkey
    command: ["valkey-server", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru", "--save", ""]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      retries: 20

volumes:
  postgres-data:
