spring:
  application:
    name: starindex
  config:
    # Local secrets: backend/.env (or the repo-root .env), KEY=VALUE lines, never committed (.gitignore).
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:15432/starindex}
    username: ${DB_USERNAME:starindex}
    password: ${DB_PASSWORD:starindex-local}
    hikari:
      maximum-pool-size: 5      # batch + admin web; PostgreSQL max_connections=20 on the 2 GiB EC2 (DB-PLAN 4.4)
      minimum-idle: 1
      idle-timeout: 600000      # ms (Hikari takes a number, not "10m")
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  batch:
    jdbc:
      initialize-schema: never   # Flyway owns BATCH_* (V1)
    job:
      enabled: false             # jobs are started by the scheduler / CLI (scripts/etl.sh), not at boot
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:16379}

server:
  port: 8080
  tomcat:
    use-relative-redirects: true

# Actuator only on loopback:8081 (CodeDeploy validate.sh); the public port exposes /api/health.
management:
  server:
    port: 8081
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

starindex:
  data-go-kr:
    # The ONE value to fill in: the data.go.kr "일반 인증키 (Decoding)" in .env as DATA_GO_KR_SERVICE_KEY=...
    # Empty → key-dependent steps stop with a clear message; key-free steps (Astronomy Engine) still run.
    service-key: ${DATA_GO_KR_SERVICE_KEY:}
    base-url: https://apis.data.go.kr
    connect-timeout: 5s
    read-timeout: 20s
    min-interval: 60ms          # ≤ ~16 calls/s, well under the 30 tps gateway limit
    daily-quota: 10000          # development account, per API
    quota-warn-ratio: 0.7
    quota-stop-ratio: 0.9
  etl:
    kma-availability-delay: 15m # issues are served from HH:10 (활용가이드); 5 min margin
    forecast-min-completeness: 0.9
    astro-days-ahead: 3
    # ADR-014 / DB-PLAN 2.2. Floors are enforced at startup (2 and 8).
    forecast-retention-days: 2  # kma_forecast_hour, kasi_riseset, star_index_nightly
    audit-retention-days: 8     # etl_api_call, astro_crosscheck, data_pack + files, BATCH_*
    pack-keep-min: 3            # newest packs per kind always kept (plus the manifest's and pinned ones)
    schedule:
      enabled: ${ETL_SCHEDULE_ENABLED:false}
  pack:
    local-dir: ${PACK_LOCAL_DIR:build/packs}
    hourly-slots: 72
