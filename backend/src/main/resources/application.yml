spring:
  application:
    name: starindex
  config:
    # Local secrets: backend/.env (or the repo-root .env), KEY=VALUE lines, never committed (.gitignore).
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:15432/starindex}
    username: ${DB_USERNAME:starindex}
    password: ${DB_PASSWORD:starindex-local}
    # Neon Free (ADR-015) suspends the compute after 5 minutes without queries and allows 100 CU-hours a month.
    # The pool must hold no idle connection between batch runs: no minimum, idle connections closed after 60 s
    # (+ up to 30 s housekeeping), and no keepalive ping (HikariCP 7 pings idle connections every 2 min by default).
    # Values are milliseconds: Hikari's setters take numbers, not "10m". Guarded by DataSourcePoolTest.
    hikari:
      maximum-pool-size: 5      # batch + admin web
      minimum-idle: 0
      idle-timeout: 60000
      keepalive-time: 0
      connection-timeout: 30000 # covers a cold start (a few hundred ms, Neon suggests allowing ~10 s)
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  batch:
    jdbc:
      initialize-schema: never   # Flyway owns BATCH_* (V1)
    job:
      enabled: false             # jobs are started by the scheduler / CLI (scripts/etl.sh), not at boot
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:16379}

server:
  port: 8080
  # LocalOnlyFilter trusts only the TCP peer address: X-Forwarded-* must never be honoured (Boot could otherwise
  # auto-enable it on some platforms), or a forged header could pose as loopback.
  forward-headers-strategy: none
  tomcat:
    use-relative-redirects: true

# Actuator only on loopback:8081 (CodeDeploy validate.sh); the public port exposes /api/health.
# Never poll /actuator/health periodically: its db indicator opens a connection and would keep Neon awake (ADR-015).
# The public /api/health (W3) must not touch the database.
management:
  server:
    port: 8081
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

starindex:
  data-go-kr:
    # The ONE value to fill in: the data.go.kr "일반 인증키 (Decoding)" in .env as DATA_GO_KR_SERVICE_KEY=...
    # Empty → key-dependent steps stop with a clear message; key-free steps (Astronomy Engine) still run.
    service-key: ${DATA_GO_KR_SERVICE_KEY:}
    base-url: https://apis.data.go.kr
    connect-timeout: 5s
    read-timeout: 20s
    min-interval: 60ms          # ≤ ~16 calls/s, well under the 30 tps gateway limit
    daily-quota: 10000          # development account, per API
    quota-warn-ratio: 0.7
    quota-stop-ratio: 0.9
  etl:
    kma-availability-delay: 15m # issues are served from HH:10 (활용가이드); 5 min margin
    forecast-min-completeness: 0.9
    astro-days-ahead: 3
    # ADR-014 / DB-PLAN 2.2. Floors are enforced at startup (2 and 8).
    forecast-retention-days: 2  # kma_forecast_hour, kasi_riseset, star_index_nightly
    audit-retention-days: 8     # etl_api_call, astro_crosscheck, data_pack + files, BATCH_*
    pack-keep-min: 3            # newest packs per kind always kept (plus the manifest's and pinned ones)
    schedule:
      enabled: ${ETL_SCHEDULE_ENABLED:false}
  pack:
    local-dir: ${PACK_LOCAL_DIR:build/packs}
    hourly-slots: 72
    # The Neon Object Storage public_read bucket the app downloads from (ADR-017), over its S3-compatible API.
    # Credentials: AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY = a Neon storage credential (token_id / s3 secret);
    # the names are the S3 SDK's, no AWS account is involved. Empty bucket → local-dir (development, tests).
    s3-bucket: ${PACK_BUCKET:}
    s3-endpoint: ${AWS_ENDPOINT_URL_S3:}     # https://br-<branch>.storage.c-<N>.aws-ap-southeast-1… (path-style only)
    s3-region: ${AWS_REGION:ap-southeast-1}
  admin:
    username: ${ADMIN_USERNAME:admin}
    # bcrypt ($2a$/$2b$/$2y$). Empty → admin login answers 503.
    # Local: htpasswd -nbBC 12 "" '<password>' | tr -d ':\n'  → ADMIN_PASSWORD_HASH=... in backend/.env
    password-hash: ${ADMIN_PASSWORD_HASH:}
    # base64 ≥32 bytes. Empty → random per process (tokens die on restart; fine for a local tool).
    jwt-secret: ${ADMIN_JWT_SECRET:}
    token-ttl: 1h
    max-failures: 5
    lockout: 15m
  ws:
    max-sessions: 500
