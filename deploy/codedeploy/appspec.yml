# CodeDeploy (EC2/on-premises) for the backend bundle built by scripts/build-bundle.sh (PLAN 3.5 CI/CD).
# The bundle root holds this file, app.jar and deploy/{app,codedeploy,ec2,postgres,systemd}. Hooks run as root.
version: 0.0
os: linux
files:
  - source: /
    destination: /opt/starindex/bundle
file_exists_behavior: OVERWRITE
hooks:
  # Runs the PREVIOUS revision's script (not on the very first deployment).
  ApplicationStop:
    - location: deploy/codedeploy/application-stop.sh
      timeout: 90
      runas: root
  BeforeInstall:
    - location: deploy/codedeploy/before-install.sh
      timeout: 60
      runas: root
  # First deployment installs packages (PostgreSQL 18 client, Valkey) through install.sh.
  AfterInstall:
    - location: deploy/codedeploy/after-install.sh
      timeout: 600
      runas: root
  ApplicationStart:
    - location: deploy/codedeploy/application-start.sh
      timeout: 120
      runas: root
  ValidateService:
    - location: deploy/codedeploy/validate.sh
      timeout: 240
      runas: root
