# Generate the Xcode project: `cd ios && xcodegen generate` (StarIndex.xcodeproj is not committed).
name: StarIndex
options:
  bundleIdPrefix: com.ryujemu
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: ko
packages:
  SkyCore:
    path: Packages/SkyCore
  SkySensors:
    path: Packages/SkySensors
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Apple Developer team (public identifier, embedded in every signed binary).
    DEVELOPMENT_TEAM: YRYU26Z2F4
    CODE_SIGN_STYLE: Automatic
targets:
  StarIndex:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: App
        excludes:
          - "Info.plist"
      - path: ../data/packs/skypack-v1.bin
        buildPhase: resources
    dependencies:
      - package: SkyCore
      - package: SkySensors
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "별 지수"
        CFBundleDevelopmentRegion: ko
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocationWhenInUseUsageDescription: "내 위치에서 보이는 하늘을 그리고 그 지역의 오늘 밤 별 지수를 보여 주기 위해 대략적인 위치를 사용합니다. 위치는 기기 밖으로 전송되지 않습니다."
        NSLocationDefaultAccuracyReduced: true
        NSMotionUsageDescription: "폰을 드는 방향에 맞춰 하늘을 보여 주기 위해 기기의 방향 센서를 사용합니다."
        ITSAppUsesNonExemptEncryption: false
        # Index pack root: the Neon Object Storage public bucket URL including the bucket name (ADR-017), so the
        # manifest is <base>/packs/manifest/latest.json. Set per configuration below;
        # empty → the chip shows "지수 서버 미설정". Only static files are downloaded; no location is sent (D4).
        StarIndexPackBaseURL: $(STARINDEX_PACK_BASE_URL)
        # ATS: XcodeGen writes ONE Info.plist for all configurations, so the Debug-only need (the simulator talks
        # to scripts/serve-packs.sh over plain HTTP on 127.0.0.1) is met with NSAllowsLocalNetworking alone.
        # It lifts ATS only for local addresses (loopback, unqualified and .local names), never for Internet
        # hosts, and needs no App Review justification (unlike NSAllowsArbitraryLoads). Release stays strict in
        # code as well: IndexStore rejects a non-https base URL outside DEBUG.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryujemu.starindex
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIStatusBarHidden: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_STRICT_CONCURRENCY: complete
      configs:
        # Debug: scripts/serve-packs.sh on the Mac (reachable from the simulator only).
        Debug:
          STARINDEX_PACK_BASE_URL: "http://127.0.0.1:8090"
        # Release: the Neon Object Storage public_read bucket (ADR-017; GitHub variable PACK_PUBLIC_URL). Anonymous
        # HTTPS reads only; the app sends nothing about the user (D4).
        Release:
          STARINDEX_PACK_BASE_URL: "https://br-plain-rain-b3ncmzca.storage.c-4.ap-southeast-1.aws.neon.tech/starindex-packs"
