name: backend

# Linux runners only (private repo: macOS minutes are ~10x). iOS tests run locally via
# scripts/test-skycore.sh.
on:
  push:
    branches: [main]
    paths: ["backend/**", "data/catalog-src/**", "deploy/**", "scripts/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "data/catalog-src/**", "deploy/**", "scripts/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: No code reads the dropped tables (ADR-014, DB-PLAN 6.1)
        run: |
          if grep -rnE '\bkma_forecast\b|kma_forecast_issue|astro_night|star_index_hourly' backend/src/main/java; then
            echo "dropped table referenced in backend/src/main/java" >&2; exit 1
          fi
      - name: Shell scripts (shellcheck is preinstalled on ubuntu-latest)
        run: shellcheck --severity=warning -x -P deploy/postgres deploy/ec2/install.sh deploy/postgres/*.sh deploy/app/start.sh deploy/test/al2023-harness.sh scripts/etl.sh scripts/ec2sim.sh scripts/deploy-check.sh
      - name: Backend tests (Testcontainers PostgreSQL 18 + Valkey, WireMock) + catalog builder (T9)
        working-directory: backend
        run: ./gradlew --no-daemon test
      - name: Rebuild skypack and compare with committed artifact
        working-directory: backend
        run: |
          # The run task's working directory is the repo root.
          ./gradlew --no-daemon -q :tools:catalog-builder:run --args="--mag 5.5 --version 1 --out backend/build/ci-packs"
          cmp build/ci-packs/skypack-v1.bin ../data/packs/skypack-v1.bin
