name: backend

# Linux runners only (private repo: macOS minutes are ~10x). iOS tests run locally via
# scripts/test-skycore.sh.
on:
  push:
    branches: [main]
    paths: ["backend/**", "data/catalog-src/**", "deploy/**", "scripts/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "data/catalog-src/**", "deploy/**", "scripts/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  # Never cancel a run on main: it may be in the middle of a CodeDeploy deployment.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: No code reads the dropped tables (ADR-014, DB-PLAN 6.1)
        run: |
          if grep -rnE '\bkma_forecast\b|kma_forecast_issue|astro_night|star_index_hourly' backend/src/main/java; then
            echo "dropped table referenced in backend/src/main/java" >&2; exit 1
          fi
      - name: Shell scripts (shellcheck is preinstalled on ubuntu-latest)
        run: shellcheck --severity=warning -x -P deploy/postgres:deploy/codedeploy deploy/ec2/install.sh deploy/postgres/*.sh deploy/app/start.sh deploy/codedeploy/*.sh deploy/test/al2023-harness.sh scripts/etl.sh scripts/ec2sim.sh scripts/deploy-check.sh scripts/build-bundle.sh
      - name: Backend tests (Testcontainers PostgreSQL 18 + Valkey, WireMock) + catalog builder (T9)
        working-directory: backend
        run: ./gradlew --no-daemon test
      - name: Rebuild skypack and compare with committed artifact
        working-directory: backend
        run: |
          # The run task's working directory is the repo root.
          ./gradlew --no-daemon -q :tools:catalog-builder:run --args="--mag 5.5 --version 1 --out backend/build/ci-packs"
          cmp build/ci-packs/skypack-v1.bin ../data/packs/skypack-v1.bin

  # main → S3 deploy/backend/<sha>.zip → CodeDeploy (PLAN 3.5). OIDC only: no AWS keys in GitHub. Skipped until
  # scripts/aws-provision.sh has set the repository variables (AWS_DEPLOY_ROLE_ARN, S3_BUCKET, CODEDEPLOY_*).
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      CODEDEPLOY_APP: ${{ vars.CODEDEPLOY_APP || 'starindex' }}
      CODEDEPLOY_GROUP: ${{ vars.CODEDEPLOY_GROUP || 'starindex-prod' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build the CodeDeploy revision (appspec.yml, app.jar, deploy/)
        run: scripts/build-bundle.sh build/deploy
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Upload to S3 and deploy
        run: |
          key="deploy/backend/${GITHUB_SHA}.zip"
          aws s3 cp build/deploy/starindex-bundle.zip "s3://${S3_BUCKET}/${key}" --only-show-errors
          id="$(aws deploy create-deployment --application-name "$CODEDEPLOY_APP" \
                --deployment-group-name "$CODEDEPLOY_GROUP" \
                --s3-location "bucket=${S3_BUCKET},key=${key},bundleType=zip" \
                --description "${GITHUB_SHA::12} ${GITHUB_RUN_ID}" --query deploymentId --output text)"
          echo "deployment $id"
          echo "### CodeDeploy \`$id\` (${GITHUB_SHA::12})" >> "$GITHUB_STEP_SUMMARY"
          if ! aws deploy wait deployment-successful --deployment-id "$id"; then
            aws deploy get-deployment --deployment-id "$id" \
              --query 'deploymentInfo.{status:status,error:errorInformation,overview:deploymentOverview}'
            exit 1
          fi
