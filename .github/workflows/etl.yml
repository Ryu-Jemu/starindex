name: etl

# Scheduled ETL on GitHub-hosted runners (ADR-017): no server and no AWS. Each run starts the backend jar once in batch
# mode against Neon PostgreSQL (Free) and publishes packs to the Neon Object Storage public bucket the app reads.
# Cost: private repositories get 2,000 Linux minutes a month on GitHub Free; without a payment method GitHub blocks
# runs past the quota instead of billing. Each job is billed in whole minutes: a forecast run ≈ 3 min and the daily
# run ≈ 5 min (measured 10-01), so ≈ 900 min a month (estimate) plus CI and ~1 min per blocked attempt. Until the
# secrets and variables below exist, every run ends at "configured?" (a few seconds).
#
# data.go.kr refuses some overseas addresses, and GitHub-hosted runners are overseas: an attempt that cannot reach it
# (a probe before the build, or the jar exiting 75 after two cells) stops early and the next attempt runs on a fresh
# runner (another address), up to 3 attempts (.github/workflows/etl-attempt.yml). Only when all 3 are blocked does the
# run fail and GitHub send its mail; that last attempt still runs retentionJob (Neon only).
#
#   secrets   DB_URL, DB_PASSWORD (ops/neon/bootstrap.sh --github), DATA_GO_KR_SERVICE_KEY,
#             NEON_STORAGE_KEY_ID, NEON_STORAGE_SECRET (neon credentials create --scope storage:read --scope storage:write)
#   variables PACK_BUCKET, PACK_S3_ENDPOINT (https://br-….storage.c-N.aws-ap-southeast-1…), PACK_S3_REGION,
#             PACK_PUBLIC_URL (= the app's STARINDEX_PACK_BASE_URL: <endpoint>/<bucket>)
on:
  schedule:
    # 단기예보 issues at 02, 05, …, 23 KST are served from HH:10 (활용가이드); run at HH:20. KST = UTC+9 maps this hour
    # set onto itself. Off the top of the hour, when GitHub delays scheduled runs the most.
    - cron: "20 2,5,8,11,14,17,20,23 * * *"
    # 00:40 KST: retention + KASI rise/set (astroDailyJob), 천문현상 (astroEventsJob), database backup.
    - cron: "40 15 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: Job to run (daily = astroDailyJob + astroEventsJob + backup)
        type: choice
        default: forecastPipelineJob
        options: [forecastPipelineJob, starIndexPublishJob, astroDailyJob, astroEventsJob, apiKeyCheckJob, retentionJob, daily]
      params:
        description: "Job parameters, space separated key=value (e.g. nightDate=2026-10-12)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: etl
  cancel-in-progress: false

jobs:
  attempt1:
    uses: ./.github/workflows/etl-attempt.yml
    with:
      attempt: 1
      event: ${{ github.event_name }}
      schedule: ${{ github.event.schedule }}
      job: ${{ inputs.job }}
      params: ${{ inputs.params }}
    secrets: inherit

  attempt2:
    needs: attempt1
    if: ${{ !cancelled() && needs.attempt1.outputs.blocked == 'true' }}
    uses: ./.github/workflows/etl-attempt.yml
    with:
      attempt: 2
      planned: true
      planned_jobs: ${{ needs.attempt1.outputs.jobs }}
      planned_params: ${{ needs.attempt1.outputs.params }}
      planned_check: ${{ needs.attempt1.outputs.check }}
    secrets: inherit

  attempt3:
    needs: [attempt1, attempt2]
    if: ${{ !cancelled() && needs.attempt2.outputs.blocked == 'true' }}
    uses: ./.github/workflows/etl-attempt.yml
    with:
      attempt: 3
      final: true
      planned: true
      planned_jobs: ${{ needs.attempt1.outputs.jobs }}
      planned_params: ${{ needs.attempt1.outputs.params }}
      planned_check: ${{ needs.attempt1.outputs.check }}
    secrets: inherit
