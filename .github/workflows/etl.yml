name: etl

# Scheduled ETL on GitHub-hosted runners (ADR-017): no server and no AWS. Each run starts the backend jar once in batch
# mode against Neon PostgreSQL (Free) and publishes packs to the Neon Object Storage public bucket the app reads.
# Cost: private repositories get 2,000 Linux minutes a month on GitHub Free; without a payment method GitHub blocks
# runs past the quota instead of billing. Expected ≈ 600 min a month (8 forecast runs a day + 1 daily run, ~2 min
# each, estimate) plus CI. Until the secrets and variables below exist, every run ends at "configured?" (a few seconds).
#
#   secrets   DB_URL, DB_PASSWORD (ops/neon/bootstrap.sh --github), DATA_GO_KR_SERVICE_KEY,
#             NEON_STORAGE_KEY_ID, NEON_STORAGE_SECRET (neon credentials create --scope storage:read --scope storage:write)
#   variables PACK_BUCKET, PACK_S3_ENDPOINT (https://br-….storage.c-N.aws-ap-southeast-1…), PACK_S3_REGION,
#             PACK_PUBLIC_URL (= the app's STARINDEX_PACK_BASE_URL: <endpoint>/<bucket>)
on:
  schedule:
    # 단기예보 issues at 02, 05, …, 23 KST are served from HH:10 (활용가이드); run at HH:20. KST = UTC+9 maps this hour
    # set onto itself. Off the top of the hour, when GitHub delays scheduled runs the most.
    - cron: "20 2,5,8,11,14,17,20,23 * * *"
    # 00:40 KST: retention + KASI rise/set (astroDailyJob), 천문현상 (astroEventsJob), database backup.
    - cron: "40 15 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: Job to run (daily = astroDailyJob + astroEventsJob + backup)
        type: choice
        default: forecastPipelineJob
        options: [forecastPipelineJob, starIndexPublishJob, astroDailyJob, astroEventsJob, apiKeyCheckJob, daily]
      params:
        description: "Job parameters, space separated key=value (e.g. nightDate=2026-10-12)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: etl
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      valkey:   # quota counters and job locks live for one run; Redis-compatible (ADR-005)
        image: valkey/valkey:8
        ports: ["6379:6379"]
    env:
      DB_URL: ${{ secrets.DB_URL }}
      DB_USERNAME: starindex
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
      PACK_BUCKET: ${{ vars.PACK_BUCKET }}
      AWS_ENDPOINT_URL_S3: ${{ vars.PACK_S3_ENDPOINT }}
      AWS_REGION: ${{ vars.PACK_S3_REGION || 'ap-southeast-1' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.NEON_STORAGE_KEY_ID }}       # a Neon storage credential, not an AWS key
      AWS_SECRET_ACCESS_KEY: ${{ secrets.NEON_STORAGE_SECRET }}
      PACK_PUBLIC_URL: ${{ vars.PACK_PUBLIC_URL }}
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
    steps:
      - name: configured?
        id: cfg
        run: |
          missing=""
          for v in DB_URL DB_PASSWORD PACK_BUCKET AWS_ENDPOINT_URL_S3 AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY PACK_PUBLIC_URL; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::notice::ETL not configured yet (missing:$missing). See docs/ETL.md, 무과금 운영."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Which jobs
        if: steps.cfg.outputs.ok == 'true'
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_JOB: ${{ inputs.job }}
          INPUT_PARAMS: ${{ inputs.params }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then job="$INPUT_JOB"
          elif [ "$SCHEDULE" = "40 15 * * *" ]; then job=daily
          else job=forecastPipelineJob; fi
          params=""
          for kv in $INPUT_PARAMS; do   # values reach the JVM as job parameters: dates and numbers only
            [[ "$kv" =~ ^(base|nightDate|from|month)=[0-9-]{1,16}$ ]] || { echo "::error::bad parameter: $kv"; exit 1; }
            params="$params $kv"
          done
          if [ "$job" = daily ]; then jobs="astroDailyJob astroEventsJob"; else jobs="$job"; fi
          # Without the data.go.kr key only the key-free work runs (retention + Astronomy Engine; index republish).
          if [ -z "$DATA_GO_KR_SERVICE_KEY" ]; then
            kept=""
            for j in $jobs; do
              case "$j" in astroDailyJob|starIndexPublishJob) kept="$kept $j" ;; *) echo "::notice::$j skipped: no DATA_GO_KR_SERVICE_KEY secret" ;; esac
            done
            jobs="${kept# }"
          fi
          {
            echo "jobs=$jobs"
            echo "params=${params# }"
            echo "backup=$([ "$job" = daily ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
          echo "jobs: ${jobs:-none} ${params}"

      - uses: actions/checkout@v7
        if: steps.cfg.outputs.ok == 'true'
      - uses: actions/setup-java@v6
        if: steps.cfg.outputs.ok == 'true'
        with:
          distribution: temurin
          java-version: "21"
      # The jar is rebuilt only when the backend changes: most runs skip Gradle entirely (minutes are the budget).
      - name: Cached jar
        if: steps.cfg.outputs.ok == 'true'
        id: jar
        uses: actions/cache@v6
        with:
          path: backend/build/etl/app.jar
          key: etl-jar-${{ hashFiles('backend/src/main/**', 'backend/build.gradle.kts', 'backend/settings.gradle.kts', 'backend/gradle/**', 'backend/libs/**') }}
      - uses: gradle/actions/setup-gradle@v6
        if: steps.cfg.outputs.ok == 'true' && steps.jar.outputs.cache-hit != 'true'
      - name: Build the jar
        if: steps.cfg.outputs.ok == 'true' && steps.jar.outputs.cache-hit != 'true'
        working-directory: backend
        run: |
          ./gradlew -q --no-daemon bootJar
          mkdir -p build/etl
          for f in build/libs/*.jar; do [[ "$f" == *-plain.jar ]] || cp "$f" build/etl/app.jar; done
          test -s build/etl/app.jar

      - name: Run
        if: steps.cfg.outputs.ok == 'true' && steps.plan.outputs.jobs != ''
        working-directory: backend
        env:
          JOBS: ${{ steps.plan.outputs.jobs }}
          PARAMS: ${{ steps.plan.outputs.params }}
        run: |
          rc=0
          for job in $JOBS; do
            echo "::group::$job"
            # KST JVM: Spring Batch stores local times; the admin page then shows the same clock for every run.
            # shellcheck disable=SC2086  # PARAMS is a validated key=value list
            java -Xmx512m -XX:+UseSerialGC -Duser.timezone=Asia/Seoul -jar build/etl/app.jar \
              --spring.main.web-application-type=none --spring.main.banner-mode=off \
              --spring.batch.job.enabled=true --spring.batch.job.name="$job" \
              --logging.level.root=WARN --logging.level.ETL=INFO \
              --logging.level.org.springframework.batch.core.step.AbstractStep=OFF \
              "run.at=$(date +%s%3N)" $PARAMS || rc=$?
            echo "::endgroup::"
          done
          exit $rc

      # What the app sees: anonymous GETs of the public bucket, sha256, gzip, freshness (two missed issues = fail).
      - name: Public pack check
        if: steps.cfg.outputs.ok == 'true' && contains(steps.plan.outputs.jobs, 'forecastPipelineJob')
        run: python3 scripts/check-public-pack.py "$PACK_PUBLIC_URL" --max-age-min 360

      # Neon Free keeps 6 hours of history; this is the real backup (ADR-015). pg_dump must be ≥ the server (18).
      - name: Backup (pg_dump)
        if: steps.cfg.outputs.ok == 'true' && steps.plan.outputs.backup == 'true'
        run: |
          rest="${DB_URL#jdbc:postgresql://}"; host="${rest%%/*}"; db="${rest#*/}"; db="${db%%\?*}"
          # The password reaches the container through the environment (-e NAME), never as an argument.
          PGPASSWORD="$DB_PASSWORD" docker run --rm -e PGPASSWORD postgres:18 pg_dump -Fc --no-tablespaces \
            "host=${host%%:*} dbname=$db user=$DB_USERNAME sslmode=require channel_binding=require" > starindex.dump
          ls -l starindex.dump
          echo "BACKUP_NAME=starindex-db-$(TZ=Asia/Seoul date +%F)" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        if: steps.cfg.outputs.ok == 'true' && steps.plan.outputs.backup == 'true'
        with:
          name: ${{ env.BACKUP_NAME }}
          path: starindex.dump
          retention-days: 7
          if-no-files-found: error
